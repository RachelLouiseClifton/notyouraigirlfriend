<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not your ai girlfriend</title>
<meta name="description" content="the market will sell you an AI girlfriend who agrees with you. wrong door.">
<style>
  :root{
    /* read by eye from Rachel's split-portrait mock (right panel) — tune here */
    --oxblood:#2e0d13;
    --oxblood-deep:#220a0f;
    --oxblood-glow:#5c1b24;
    --bone:#e9ddca;
    --bone-dim:#c9b8a0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:radial-gradient(ellipse 60% 55% at 50% 38%, var(--oxblood-glow) 0%, var(--oxblood) 62%, var(--oxblood-deep) 100%);
    color:var(--bone);
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wordmark{
    text-align:center;padding:1.2rem 1rem 0;
    font-size:.78rem;letter-spacing:.55em;text-indent:.55em;
    color:var(--bone-dim);
  }
  main{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    max-width:34rem;width:100%;margin:0 auto;padding:2rem 1.6rem 14vh;
  }
  #her{
    font-style:italic;font-size:clamp(1.45rem,3.2vw,2rem);
    line-height:1.3;min-height:3.9em;
  }
  #her .cursor{display:inline-block;width:.5em;opacity:.7;animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  form{margin-top:2.4rem;display:flex;gap:.6rem;border-bottom:1px solid var(--bone-dim);padding-bottom:.5rem}
  input{
    flex:1;background:none;border:none;outline:none;
    font-family:inherit;font-size:1.05rem;color:var(--bone);
  }
  input::placeholder{color:var(--bone-dim);font-style:italic}
  button{
    background:none;border:none;color:var(--bone-dim);cursor:pointer;
    font-family:inherit;font-size:1.05rem;font-style:italic;
  }
  button:hover{color:var(--bone)}
  footer{
    text-align:center;padding:1.4rem;font-size:.8rem;color:var(--bone-dim);
  }
  footer a{color:inherit}
</style>
</head>
<body>
  <div class="wordmark">not your ai girlfriend</div>
  <main>
    <p id="her" aria-live="polite"></p>
    <form id="f" autocomplete="off">
      <input id="in" type="text" placeholder="say it" aria-label="tell her">
      <button type="submit">→</button>
    </form>
  </main>
  <footer><a href="https://meetflow.love">the other door</a></footer>
  <script>
    // she speaks first — typed as if you walked in mid-sentence
    const OPENING = "go on. tell me the thing you’ve been hiding from.";
    const REPLY = "loading...";
    const her = document.getElementById('her');
    let i = 0;
    function type(){
      her.innerHTML = OPENING.slice(0, i) + '<span class="cursor">|</span>';
      if (i++ <= OPENING.length) setTimeout(type, 34 + Math.random()*40);
      else her.textContent = OPENING;
    }
    setTimeout(type, 600);
    document.getElementById('f').addEventListener('submit', e => {
      e.preventDefault();
      if (!document.getElementById('in').value.trim()) return;
      her.textContent = REPLY;
      document.getElementById('in').value = '';
    });
  </script>
</body>
</html>
